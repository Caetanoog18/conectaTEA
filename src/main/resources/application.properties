spring.application.name=conectatea-api

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=conectatea-api
app.security.jwt.expiration=PT1H

app.bootstrap.admin.name=${INITIAL_ADMIN_NAME:System Administrator}
app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
