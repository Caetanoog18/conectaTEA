spring.application.name=conectatea-api

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=conectatea-api
app.security.jwt.expiration=PT1H
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.security.login.max-attempts=${LOGIN_MAX_ATTEMPTS:5}
app.security.login.window=${LOGIN_ATTEMPT_WINDOW:PT15M}
app.security.login.block-duration=${LOGIN_BLOCK_DURATION:PT15M}
app.security.login.max-tracked-keys=${LOGIN_MAX_TRACKED_KEYS:10000}

app.bootstrap.admin.name=${INITIAL_ADMIN_NAME:System Administrator}
app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:}
app.bootstrap.admin.password=${INITIAL_ADMIN_PASSWORD:}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
